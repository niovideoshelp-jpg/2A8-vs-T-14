name: Renderizar vídeo

# Renderiza na nuvem (GitHub Actions) e publica cada MP4 como artefato.
# Manual: aba Actions → "Renderizar vídeo" → Run workflow → escolha a parte (ou "Todos").
# Automático: a cada push na main que altere código, assets ou este workflow (renderiza a Intro).
on:
  workflow_dispatch:
    inputs:
      composicao:
        description: "Parte a renderizar"
        type: choice
        default: Intro
        options: [Intro, Ch1, Ch2, Ch3, Ch4, Ch5, Ch6, Ch7, Final, Todos]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render.yml"

concurrency:
  group: render-${{ github.ref }}-${{ inputs.composicao || 'push' }}
  cancel-in-progress: true

jobs:
  lista:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - id: ids
        run: |
          case "${{ inputs.composicao || 'Intro' }}" in
            Todos) echo 'ids=["Intro","Ch1","Ch2","Ch3","Ch4","Ch5","Ch6","Ch7","Final"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'ids=["${{ inputs.composicao || 'Intro' }}"]' >> "$GITHUB_OUTPUT" ;;
          esac

  render:
    needs: lista
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.lista.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências do sistema (ffmpeg + bibliotecas do Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2 libasound2t64

      - run: npm ci

      - name: Chrome Headless do Remotion
        run: npx remotion browser ensure

      - name: Verificar tipos e lint
        run: npm run lint

      - name: Renderizar (1080p · H.264)
        run: npx remotion render ${{ matrix.id }} out/${{ matrix.id }}_raw.mp4 --codec=h264 --crf=16 --jpeg-quality=92 --audio-bitrate=320k --concurrency=100%

      - name: Masterizar loudness (-14 LUFS)
        run: node scripts/master.mjs out/${{ matrix.id }}_raw.mp4 out/${{ matrix.id }}_2A8_vs_T14.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}_2A8_vs_T14-${{ github.run_number }}
          path: out/${{ matrix.id }}_2A8_vs_T14.mp4
          retention-days: 30
